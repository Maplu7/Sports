<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/assets/flower.svg" type="image/svg+xml"><title>Cozy Game Day V9 Data Doctor</title><style>
body{font:15px system-ui;background:#fff8fb;color:#332b31;max-width:850px;margin:auto;padding:20px}
.c{background:white;border:1px solid #efd5df;border-radius:18px;padding:14px;margin:10px 0}.ok{color:#237a48}.bad{color:#a34848}
pre{white-space:pre-wrap;word-break:break-word;max-height:170px;overflow:auto;background:#fff6f9;padding:9px;border-radius:10px}
</style></head><body><h1>Cozy Game Day V9 Data Doctor 🌸</h1>
<p>This version tests both the clean <b>/api/sports</b> path and Netlify's direct function path.</p><div id="tests"></div><p><a href="/">← Back to tracker</a></p>
<script>
const routes=["/api/sports","/.netlify/functions/sports"];
for(const route of routes)for(const feed of ["health","nfl","cfb","atp","wta"])(async()=>{
 const box=document.createElement("div");box.className="c";box.innerHTML=`<b>${route} → ${feed.toUpperCase()}</b><p>Checking…</p>`;tests.append(box);
 try{
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),15000);
  const r=await fetch(`${location.origin}${route}?feed=${feed}&v=9`,{cache:"no-store",signal:ctl.signal});
  clearTimeout(timer);const text=await r.text();let j;try{j=JSON.parse(text)}catch{}
  const count=j?.events?.length;
  box.innerHTML=`<b>${route} → ${feed.toUpperCase()}</b><p class="${r.ok?"ok":"bad"}">${r.ok?"✓ WORKING":"✕ HTTP "+r.status}${count!==undefined?" • "+count+" events":""}</p><pre>${r.ok?(feed==="health"?JSON.stringify(j,null,2):"JSON received successfully"):text.slice(0,1200)}</pre>`;
 }catch(e){box.innerHTML=`<b>${route} → ${feed.toUpperCase()}</b><p class=bad>✕ Browser request failed: ${e.message}</p>`}
})()
</script></body></html>
