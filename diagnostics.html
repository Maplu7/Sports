<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cozy Game Day Diagnostics</title>
<style>body{font-family:system-ui;margin:0;background:#fff7fb;color:#352833}.wrap{max-width:700px;margin:auto;padding:24px}.card{background:white;border:1px solid #efcad7;border-radius:22px;padding:18px;margin:12px 0}button{border:0;border-radius:14px;padding:11px 14px;background:#d8799a;color:white;font-weight:800}pre{white-space:pre-wrap;word-break:break-word;background:#fff4f8;padding:12px;border-radius:14px}</style></head>
<body><div class="wrap"><h1>💗 Cozy Game Day Diagnostics</h1><p>This page checks the exact Netlify backend used by the mobile app.</p>
<div class="card"><b>Netlify function</b><pre id="health">Checking…</pre></div>
<div class="card"><b>NFL feed</b><pre id="nfl">Checking…</pre></div>
<button onclick="location.href='/'">Back to Cozy Game Day</button></div>
<script>
async function check(id,url){try{const r=await fetch(url,{cache:"no-store"});const t=await r.text();document.getElementById(id).textContent=`HTTP ${r.status}\n${t.slice(0,1000)}`}catch(e){document.getElementById(id).textContent=String(e)}}
check("health","/api/sports?feed=health");check("nfl","/api/sports?feed=nfl");
</script></body></html>
